<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D14" />
      <stop offset="40%" stop-color="#0B131E" />
      <stop offset="100%" stop-color="#061F24" />
    </linearGradient>

    <!-- Accent Teal Gradients -->
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DE1C9" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DE1C9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2DE1C9" stop-opacity="0.05" />
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2DE1C9" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="30" cy="0" r="1" fill="#2DE1C9" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.5px; fill: #FFFFFF; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 15px; fill: #2DE1C9; letter-spacing: 2px; }
    .desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 13.5px; fill: #94A3B8; }
    .tag-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #E2E8F0; letter-spacing: 0.5px; }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" />

  <!-- Cyber Grid Overlay -->
  <rect width="900" height="240" rx="16" fill="url(#cyber-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="820" cy="60" r="140" fill="#2DE1C9" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="200" r="100" fill="#3B82F6" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Sleek Border -->
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="#2DE1C9" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Corner Tech Brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#2DE1C9" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 884 36 L 884 16 L 864 16" fill="none" stroke="#2DE1C9" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 16 204 L 16 224 L 36 224" fill="none" stroke="#2DE1C9" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 884 204 L 884 224 L 864 224" fill="none" stroke="#2DE1C9" stroke-width="2.5" stroke-linecap="round" />

  <!-- Decorative Audio Waveform Visualizer (Right Side) -->
  <g transform="translate(560, 45)">
    <!-- Waveform background panel -->
    <rect x="0" y="0" width="280" height="150" rx="12" fill="#0D1624" fill-opacity="0.7" stroke="#2DE1C9" stroke-width="1" stroke-opacity="0.2" />
    
    <!-- Header inside card -->
    <circle cx="16" cy="18" r="4" fill="#2DE1C9" />
    <circle cx="28" cy="18" r="4" fill="#00F5D4" fill-opacity="0.5" />
    <circle cx="40" cy="18" r="4" fill="#3B82F6" fill-opacity="0.5" />
    <text x="60" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1">AUDIO FORENSICS RADAR</text>
    
    <!-- Audio Frequency Bars -->
    <g transform="translate(18, 120)">
      <rect x="0" y="-18" width="4" height="18" rx="2" fill="#2DE1C9" fill-opacity="0.4" />
      <rect x="8" y="-36" width="4" height="36" rx="2" fill="#2DE1C9" fill-opacity="0.6" />
      <rect x="16" y="-52" width="4" height="52" rx="2" fill="#2DE1C9" fill-opacity="0.8" />
      <rect x="24" y="-24" width="4" height="24" rx="2" fill="#2DE1C9" fill-opacity="0.5" />
      <rect x="32" y="-68" width="4" height="68" rx="2" fill="#00F5D4" />
      <rect x="40" y="-45" width="4" height="45" rx="2" fill="#2DE1C9" fill-opacity="0.7" />
      <rect x="48" y="-80" width="4" height="80" rx="2" fill="#2DE1C9" />
      <rect x="56" y="-60" width="4" height="60" rx="2" fill="#00F5D4" />
      <rect x="64" y="-30" width="4" height="30" rx="2" fill="#2DE1C9" fill-opacity="0.6" />
      <rect x="72" y="-72" width="4" height="72" rx="2" fill="#2DE1C9" />
      <rect x="80" y="-50" width="4" height="50" rx="2" fill="#3B82F6" />
      <rect x="88" y="-35" width="4" height="35" rx="2" fill="#2DE1C9" fill-opacity="0.6" />
      <rect x="96" y="-64" width="4" height="64" rx="2" fill="#00F5D4" />
      <rect x="104" y="-82" width="4" height="82" rx="2" fill="#2DE1C9" />
      <rect x="112" y="-48" width="4" height="48" rx="2" fill="#2DE1C9" fill-opacity="0.7" />
      <rect x="120" y="-32" width="4" height="32" rx="2" fill="#2DE1C9" fill-opacity="0.5" />
      <rect x="128" y="-70" width="4" height="70" rx="2" fill="#00F5D4" />
      <rect x="136" y="-55" width="4" height="55" rx="2" fill="#2DE1C9" />
      <rect x="144" y="-38" width="4" height="38" rx="2" fill="#3B82F6" />
      <rect x="152" y="-75" width="4" height="75" rx="2" fill="#2DE1C9" />
      <rect x="160" y="-60" width="4" height="60" rx="2" fill="#00F5D4" />
      <rect x="168" y="-40" width="4" height="40" rx="2" fill="#2DE1C9" fill-opacity="0.6" />
      <rect x="176" y="-28" width="4" height="28" rx="2" fill="#2DE1C9" fill-opacity="0.4" />
      <rect x="184" y="-48" width="4" height="48" rx="2" fill="#2DE1C9" fill-opacity="0.7" />
      <rect x="192" y="-65" width="4" height="65" rx="2" fill="#00F5D4" />
      <rect x="200" y="-38" width="4" height="38" rx="2" fill="#2DE1C9" fill-opacity="0.6" />
      <rect x="208" y="-22" width="4" height="22" rx="2" fill="#2DE1C9" fill-opacity="0.4" />
      <rect x="216" y="-50" width="4" height="50" rx="2" fill="#2DE1C9" fill-opacity="0.8" />
      <rect x="224" y="-30" width="4" height="30" rx="2" fill="#3B82F6" />
      <rect x="232" y="-15" width="4" height="15" rx="2" fill="#2DE1C9" fill-opacity="0.3" />
    </g>

    <!-- Spectrogram Threshold Line -->
    <line x1="18" y1="55" x2="258" y2="55" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.8" />
    <text x="180" y="50" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#F43F5E" letter-spacing="0.5">AI DETECTION 98.6%</text>
  </g>

  <!-- Left Content Area -->
  <!-- Top Tagline -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="168" height="22" rx="11" fill="#2DE1C9" fill-opacity="0.12" stroke="#2DE1C9" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="10" cy="11" r="3.5" fill="#2DE1C9" />
    <text x="20" y="15" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#2DE1C9" letter-spacing="1.2">PORTFOLIO &amp; LABS</text>
  </g>

  <!-- Main Name Title -->
  <text x="48" y="112" class="title">
    Shubham Kumar Tripathi
  </text>

  <!-- Subtitle with Gradient -->
  <text x="48" y="138" class="subtitle">
    AI &amp; AUDIO FORENSICS &bull; FULL-STACK &bull; DATA SCIENCE
  </text>

  <!-- Description -->
  <text x="48" y="162" class="desc">
    Creator of AudioArtifact v2.0 &bull; Engineering timeline deepfake audio localizers
  </text>
  <text x="48" y="180" class="desc">
    Building production-grade AI applications with WavLM, XGBoost, FastAPI &amp; React.
  </text>

  <!-- Tech Badges / Pills -->
  <g transform="translate(48, 196)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="102" height="24" rx="6" fill="#162230" stroke="#2DE1C9" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="11" y="16" class="tag-text">🎙️ WavLM SOTA</text>

    <!-- Pill 2 -->
    <rect x="110" y="0" width="88" height="24" rx="6" fill="#162230" stroke="#2DE1C9" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="121" y="16" class="tag-text">🐍 Python ML</text>

    <!-- Pill 3 -->
    <rect x="206" y="0" width="86" height="24" rx="6" fill="#162230" stroke="#2DE1C9" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="217" y="16" class="tag-text">⚡ FastAPI</text>

    <!-- Pill 4 -->
    <rect x="300" y="0" width="80" height="24" rx="6" fill="#162230" stroke="#2DE1C9" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="311" y="16" class="tag-text">⚛️ React</text>

    <!-- Pill 5 -->
    <rect x="388" y="0" width="86" height="24" rx="6" fill="#162230" stroke="#2DE1C9" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="399" y="16" class="tag-text">📊 Streamlit</text>
  </g>
</svg>
