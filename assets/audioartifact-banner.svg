  <g stroke="#2de1c9" stroke-width="5" opacity="0.85">
    <line x1="60" y1="45" x2="130" y2="45"/>
    <line x1="870" y1="200" x2="940" y2="200"/>
  </g>

  <text x="500" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900"
    font-size="46" fill="#eafffb" filter="url(#glow2)">AUDIO ARTIFACT</text>

  <text x="500" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700"
    font-size="19" letter-spacing="3" fill="#2de1c9" filter="url(#glow2)">DEEPFAKE AUDIO DETECTOR</text>
</svg>
